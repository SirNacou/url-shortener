version: 3

includes:
  backend:
    dir: backend
    taskfile: backend/Taskfile.yml
  frontend:
    dir: frontend
    taskfile: frontend/Taskfile.yml
  infra:
    dir: infra
    taskfile: infra/Taskfile.yml

tasks:
  default:
    cmd: task --list-all

  build:
    cmds:
      - task: backend:build
      - task: frontend:build

  gen:api:spec:
    desc: "Generate OpenAPI JSON specification from Go definitions"
    dir: backend
    sources:
      - "**/*.go"
    generates:
      - "../frontend/src/api/openapi.json"
    cmds:
      - go run ./cmd/gen > ../frontend/src/api/openapi.json

  gen:api:types:
    desc: "Generate TypeScript types from OpenAPI JSON using Bun"
    dir: frontend
    deps:
      - gen:api:spec
    sources:
      - "src/api/openapi.json"
    generates:
      - "src/api"
    cmds:
      - bun run openapi-ts

  gen:api:
    desc: "Full generation: OpenAPI JSON and TypeScript types"
    cmds:
      - task: gen:api:types
